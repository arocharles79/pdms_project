<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 20px;
        }

        h1 {
            margin-bottom: 30px;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card h3 {
            margin-top: 0;
            color: #2c3e50;
        }

        .card p {
            color: #555;
        }
    </style>
</head>
<body>

    <h1>Welcome {{ request.user.username }}</h1>

    <div class="container">
        <div class="card">
            <h3>Production</h3>
            <p>Track batches & stage logs</p>
        </div>

        <div class="card">
            <h3>QC</h3>
            <p>QC tests and hold management</p>
        </div>

        <div class="card">
            <h3>Inventory</h3>
            <p>Stock movement and tracking</p>
        </div>
    </div>

</body>
</html>
